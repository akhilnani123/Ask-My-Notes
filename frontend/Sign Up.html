<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#FFA6FB;
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    /* HEADER */
    header{
      background:#100311;
      padding:15px 30px;
    }

    nav{
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
    }

    .logo{
      color:white;
      font-size:24px;
      font-weight:bold;
    }

    .nav-links{
      display:flex;
      gap:15px;
      flex-wrap:wrap;
    }

    .nav-links a{
      text-decoration:none;
      background:#FF4081;
      color:white;
      padding:10px 16px;
      border-radius:8px;
      transition:0.3s;
    }

    .nav-links a:hover{
      opacity:0.8;
    }

    /* MAIN */
    main{
      flex:1;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:30px 15px;
    }

    section{
      background:rgb(212, 161, 204);
      width:100%;
      max-width:450px;
      padding:35px;
      border-radius:15px;
      box-shadow:0 4px 15px rgba(0,0,0,0.2);
    }

    section h1{
      text-align:center;
      color:#170219;
      margin-bottom:25px;
    }

    form{
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .form-group{
      display:flex;
      flex-direction:column;
    }

    label{
      margin-bottom:6px;
      font-weight:bold;
      color:#030000;
    }

    input{
      padding:12px;
      border:1px solid #ccc;
      border-radius:8px;
      font-size:16px;
      outline:none;
    }

    input:focus{
      border-color:#dba3e2;
    }

    button{
      background:#261fb1;
      color:white;
      border:none;
      padding:14px;
      border-radius:8px;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#e73370;
    }

    .login-link{
      text-align:center;
      margin-top:10px;
    }

    .login-link a{
      color:#831C91;
      text-decoration:none;
      font-weight:bold;
    }

    /* FOOTER */
    footer{
      background:#831C91;
      color:white;
      text-align:center;
      padding:15px;
    }

    /* RESPONSIVE DESIGN */
    @media (max-width:600px){

      nav{
        flex-direction:column;
        gap:15px;
      }

      .nav-links{
        justify-content:center;
      }

      section{
        padding:25px;
      }
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header>
    <nav>
      <div class="logo">MyWebsite</div>

      <div class="nav-links">
        <a href="#">Account</a>
        <a href="#">Contact Us</a>
        <a href="#">Sign Up</a>
      </div>
    </nav>
  </header>

  <!-- Main Content -->
  <main>
    <section aria-labelledby="signup-heading">

      <h1 id="signup-heading">Sign Up</h1>

      <form>

        <div class="form-group">
          <label for="fullname">Full Name</label>
          <input 
            type="text" 
            id="fullname" 
            name="fullname" 
            placeholder="Enter your full name"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="Enter your email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Enter password"
            required
          >
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input 
            type="password" 
            id="confirm-password" 
            name="confirm-password" 
            placeholder="Confirm password"
            required
          >
        </div>

        <button type="submit">Sign Up</button>

      </form>

      <p class="login-link">
        Already have an account?
        <a href="#">Login</a>
      </p>

    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 MyWebsite. All Rights Reserved.</p>
  </footer>

</body>
</html>
